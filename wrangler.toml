name = "edgetunnel"
main = "_worker.js"
compatibility_date = "2025-11-04"
keep_vars = true
workers_dev = false
preview_urls = false

[[routes]]
pattern = "g5gx9c.nocal.host"
custom_domain = true

[[routes]]
pattern = "g5gx9c.nocal.host/*"
zone_name = "nocal.host"

[[kv_namespaces]]
binding = "KV"			#KV绑定名默认不可修改
id = "4d068898a6ba4ef38c6a7f04a414b4fd"

[observability]
enabled = true
head_sampling_rate = 1
